name: Trigger auto deployment for runqy-server-dev

# Staging: every push to `dev` builds the server image and deploys it to the
# runqy-server-dev Azure Container App. The OIDC federated credential is bound to
# refs/heads/dev, so this workflow can only deploy from that branch.
on:
  push:
    branches:
      [ dev ]

  # Allow manual trigger (run it on the dev branch)
  workflow_dispatch:

concurrency:
  group: runqy-server-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RUNQYSERVERDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RUNQYSERVERDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RUNQYSERVERDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: publikeyregistrydev.azurecr.io
          registryUsername: ${{ secrets.RUNQYSERVERDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RUNQYSERVERDEV_REGISTRY_PASSWORD }}
          containerAppName: runqy-server-dev
          resourceGroup: runqy
          imageToBuild: publikeyregistrydev.azurecr.io/runqy-server-dev:${{ github.sha }}
          targetPort: 3000
          buildArguments: VERSION=dev-${{ github.sha }} COMMIT=${{ github.sha }}

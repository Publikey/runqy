name: Trigger auto deployment for runqy-server-dev

# Staging: every push to `dev` builds the server image, pushes it to ACR and rolls the
# runqy-server-dev Azure Container App onto it. The OIDC federated credential is bound to
# refs/heads/dev, so this workflow can only deploy from that branch.
#
# Explicit build + `az containerapp update` instead of azure/container-apps-deploy-action:
# the action's `containerapp up` assumes the Container Apps environment lives in the app's
# resource group (here it is in publikey-dev) and fails with Forbidden.
on:
  push:
    branches:
      [ dev ]

  # Allow manual trigger (run it on the dev branch)
  workflow_dispatch:

concurrency:
  group: runqy-server-dev
  cancel-in-progress: true

env:
  REGISTRY: publikeyregistrydev.azurecr.io
  IMAGE: publikeyregistrydev.azurecr.io/runqy-server-dev
  APP_NAME: runqy-server-dev
  RESOURCE_GROUP: runqy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the OIDC JWT Token
      contents: read  # Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.RUNQYSERVERDEV_REGISTRY_USERNAME }}
          password: ${{ secrets.RUNQYSERVERDEV_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:dev
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RUNQYSERVERDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RUNQYSERVERDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RUNQYSERVERDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --revision-suffix "${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --only-show-errors \
            --query "{revision:properties.latestRevisionName, status:properties.runningStatus}" -o table
